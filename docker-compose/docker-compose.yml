services:
  meshnet:
    image: ghcr.io/nmbradley/nordvpn-meshnet:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file: .env
    # NOTE: hostname must be DIFFERENT from NORDVPN_NICKNAME, or the client
    # rejects the nickname ("a domain with this name already exists").
    hostname: meshnet
    volumes:
      # Persists the NordVPN device identity: without this, every container
      # recreation registers a brand-new peer on your Meshnet.
      - nordvpn-data:/var/lib/nordvpn
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Auto-updates the meshnet container when a new image is published.
  # Scoped by label so it never touches other containers on this host.
  watchtower:
    image: ghcr.io/containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400

volumes:
  nordvpn-data:
